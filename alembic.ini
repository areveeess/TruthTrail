# Alembic command-line configuration (D-19, RESEARCH Pattern 8, F-14).
#
# The migrations live inside the package (src/truthtrail/db/migrations) so the image carries
# them and the readiness check can read the head revision without this file. There is NO
# sqlalchemy.url here, and none may be added: env.py reads DATABASE_URL from the environment
# (or a connection supplied by the caller), because a URL passed through the ini or
# set_main_option can leak the password in an interpolation error.
#
# Usage from the repository root:  DATABASE_URL=... uv run alembic upgrade head

[alembic]
script_location = %(here)s/src/truthtrail/db/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
