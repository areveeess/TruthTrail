[pytest]
pythonpath = .
testpaths = tests
xfail_strict = true
addopts = -ra
# Warnings are errors. This is only stable because requirements*.txt pin the transitive
# dependencies (starlette 1.8.0, urllib3, anyio, ...); bump them deliberately and re-run the suite.
filterwarnings =
    error
    ignore:Using .httpx. with .starlette.testclient. is deprecated
