# CI on every push and pull request, seven jobs: copy-guard, gitleaks, tests (with coverage gate), lint, typecheck,
# audit (pip-audit against the exported lock) and docker (build, run with DEMO_MODE=true, probe the endpoints).
# Installs use uv with the committed uv.lock (Phase 2). The tests job runs against a PostgreSQL 17 service
# container (pinned by tag and digest) with REQUIRE_DB=1 and a floor on executed database tests, after the real
# Alembic round trip upgrade head, downgrade base, upgrade head and check (Phase 3, D-29).
# Third-party actions are pinned by full commit SHA with the version in a trailing comment (D-20).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run --locked --no-dev python scripts/copy_guard.py

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Commit after the key rotation; history up to and including it is never scanned (D-09).
      RANGE_FLOOR: "a5dd8257e920923677c60e70611a6f36d87747b2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The pinned release is checksum-verified inside the script; the binary lives outside the workspace.
      - name: Install gitleaks (pinned, checksum verified)
        run: bash scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks"
      # Proves the range rules, the fail-closed paths and redacted detection in throwaway repositories, so a
      # regression in scripts/gitleaks_scan.sh turns CI red instead of silently weakening the scan.
      - name: Selftest the scan script
        run: bash scripts/gitleaks_selftest.sh "$RUNNER_TEMP/gitleaks/gitleaks"
      # PR_BASE is passed unchanged: scripts/gitleaks_scan.sh scans from merge-base(base, head) when the
      # base branch has advanced past the fork point (and from the floor when that merge-base lies at or
      # behind it), so a stale PR stays scannable, while an unresolvable base still fails the job with
      # exit 2 (D-09, D-20).
      - name: Scan working tree and commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
          else
            # Push: always scan the whole post-floor history (floor..sha), never just before..sha. With
            # cancel-in-progress a superseded run is cancelled, and a cancelled run is not a failure; scanning
            # only before..sha would then leave the cancelled push's commits permanently unscanned, so a key
            # committed in one push and deleted in the next would pass (D-09). Each run is cumulative instead.
            BASE="$RANGE_FLOOR"
            HEAD_SHA="$PUSH_AFTER"
          fi
          bash scripts/gitleaks_scan.sh "$RUNNER_TEMP/gitleaks/gitleaks" "$BASE" "$HEAD_SHA" "$RANGE_FLOOR"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL 17 for the database tests (D-28, D-29). postgres:17.11-bookworm is pinned by the registry
    # manifest digest (an OCI image index) resolved on 2026-11-06. ci-throwaway is the password of this job-local
    # service container, which exists only for the job and is reachable only from the runner: it is not a
    # secret, and it is kept short and unquoted so the credential backstop cannot read it as one.
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests create, migrate and drop their own truthtrail_test_* databases on this server; they never read
      # DATABASE_URL. REQUIRE_DB=1 makes an unreachable server a hard error instead of a local fallback, and
      # the run fails when fewer database tests executed than REQUIRE_DB_FLOOR (the collected requires_db
      # count when the floor was last set; it only ratchets up).
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/postgres
      REQUIRE_DB: "1"
      REQUIRE_DB_FLOOR: "217"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # The real Alembic command line against the service's default database (empty at this point), in addition
      # to the programmatic round trip in tests/test_migrations.py (D-29, SC2). DATABASE_URL is set per step only.
      - name: Alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/postgres
        run: uv run --locked alembic upgrade head
      - name: Alembic downgrade base
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/postgres
        run: uv run --locked alembic downgrade base
      - name: Alembic upgrade head again
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/postgres
        run: uv run --locked alembic upgrade head
      - name: Alembic check (models and migrations agree)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/postgres
        run: uv run --locked alembic check
      # --cov enforces [tool.coverage.report] fail_under from pyproject.toml (D-15).
      - run: uv run --locked pytest --cov --hypothesis-profile=ci -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mypy

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # The audit covers the whole locked closure, hashes included. A new advisory turns this job red; handle it
      # with `--ignore-vuln {ID}` plus a dated comment naming the advisory and why it is not exploitable here,
      # never by skipping the job.
      - name: Export the locked dependencies
        run: uv export --locked --no-emit-project --all-groups --format requirements-txt -o "$RUNNER_TEMP/audit.txt"
      - name: Audit the exported lock
        run: uv run --locked pip-audit -r "$RUNNER_TEMP/audit.txt" --require-hashes --disable-pip --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t truthtrail:ci .
      # DEMO_MODE=true serves the labelled synthetic fixture, so no key or secret is needed.
      - name: Start the container
        run: docker run -d -e DEMO_MODE=true -p 8000:8000 truthtrail:ci > "$RUNNER_TEMP/container_id"
      # Docker's userland port proxy accepts the connection before uvicorn binds and then resets it, which
      # curl reports as exit 56 or 52, not "connection refused"; only --retry-all-errors retries those.
      - name: Probe /health
        run: curl -fsS --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health
      - name: Probe /ready
        run: curl -fsS http://127.0.0.1:8000/ready
      - name: Probe /analyze (synthetic demo data)
        run: |
          body=$(curl -fsS "http://127.0.0.1:8000/analyze?query=ci")
          printf '%s\n' "$body" | head -c 300
          grep -q '"synthetic":true' <<< "$body"
      - name: Assert non-root user and no legacy or dev modules
        run: |
          container=$(cat "$RUNNER_TEMP/container_id")
          uid=$(docker exec "$container" id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
          docker exec "$container" python -I -c "import importlib.util as u, sys; bad = [n for n in ('spread_simulator', 'users', 'risk_analyzer', 'pytest') if u.find_spec(n) is not None]; print('importable:', bad); sys.exit(1 if bad else 0)"
      # The packaged migrations ship in the image (D-29): readiness reads the head from them, so a missing
      # directory or revision fails this step.
      - name: Assert the packaged migrations are in the image
        run: |
          container=$(cat "$RUNNER_TEMP/container_id")
          docker exec "$container" python -I -c "from truthtrail.db import packaged_head; head = packaged_head(); print(head); assert head"
      # Runs even after a failure, prints the logs and stops the container; a failure above still fails the job.
      - name: Container logs and cleanup
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/container_id" ]; then
            container=$(cat "$RUNNER_TEMP/container_id")
            docker logs "$container" || true
            docker stop "$container" || true
          fi
