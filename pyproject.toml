[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "truthtrail"
version = "0.1.0"
description = "Misinformation early-warning service: flag for human review."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.8.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
    "requests==2.34.2",
    "slowapi==0.1.10",
    "limits==5.8.0",
    "cachetools==7.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.1",
    "responses==0.26.3",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
]
# Unused until Phase 4 (model training); present in uv.lock, absent from `uv sync`.
train = [
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
# legacy holds the flat modules (`from users import USERS`); the repo root holds the main.py shim.
pythonpath = ["legacy", "."]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra"
# Warnings are errors. This is stable because the transitive closure is pinned by uv.lock, so a
# third-party warning cannot appear without a deliberate lock change.
filterwarnings = [
    "error",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["truthtrail"]
branch = true

[tool.coverage.report]
# Measured total on the final Phase 2 tree: 98.342 percent (line plus branch). The gate is the
# measured baseline minus 2 points (floor(98.342) - 2 = 96). It may only be raised, never lowered.
# It is not in addopts, so partial test runs never trip it; CI runs `pytest --cov` (D-15).
fail_under = 96
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
# legacy/ holds the frozen Phase 1 modules; no tool may rewrite them (D-02, D-25).
# ruff 0.17 also lints and formats Python code blocks inside Markdown; planning notes and the
# README are prose, not source, so Markdown is excluded.
extend-exclude = ["legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["truthtrail"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.format]
# The exclusion keeps the frozen rule file byte-identical, so its sha256 pin holds (D-02, D-25).
exclude = ["src/truthtrail/services/keyword_baseline.py"]

[tool.mypy]
files = ["src/truthtrail"]
strict = true
plugins = ["pydantic.mypy"]
